# ── DeepSeek-R1-Distill-Qwen-14B — reasoning model, pulled from HF on load ─────
# Genuine dense distill of DeepSeek's reasoning line (Qwen2.5-14B backbone).
# NOTE: this is the closest runnable "DeepSeek" for a 64 GB Mac — the current
# DeepSeek-V4.1-Flash (552B MoE, ~510 GB FP4) does NOT fit and has no small
# standalone variant; the ~5 GB "DSpark" files are speculative draft heads that
# still require the full multi-hundred-GB target, so they are not usable here.
# Recommended sampling per the model card: temp 0.6, top-p 0.95, no system prompt.
[deepseek-r1]
hf                   = unsloth/DeepSeek-R1-Distill-Qwen-14B-GGUF:Q4_K_M
ctx-size             = 131072
cache-type-k         = q8_0
cache-type-v         = q8_0
context-shift        = 1
keep                 = 4
temp                 = 0.6
top-p                = 0.95
top-k                = 20
min-p                = 0.0
presence-penalty     = 0.0
repeat-penalty       = 1.0

# ── Muse-Glimmer-30B (Meta) — dense 30B, vision, 128K ctx (~18 GB + 1.6 GB draft) ─
# unsloth UD-Q4_K_XL + Q8 vision projector + Meta's DFlash drafter.
# Benchmarked on this M1 Max (2026-11-06): ~9 t/s plain → 14-20 t/s with DFlash.
# spec-draft-n-max 6 was fastest (tested 4 / 6 / 15; trained block size is 16,
# but acceptance on M1 Max is too low for long drafts). Q6 gave the same answers
# but was 25% slower, so Q4 is used. Thinks by default; to reduce reasoning,
# put "Reasoning strength: low" (low/medium/high/xhigh) in the system prompt.
# Sampling per Meta's generation_config.json.
[muse-glimmer]
model                = /Users/jwulf/.cache/huggingface/hub/models--unsloth--Muse-Glimmer-30B-GGUF/snapshots/faa5b025c584459c13febfa5c59883516710ae39/Muse-Glimmer-30B-UD-Q4_K_XL.gguf
