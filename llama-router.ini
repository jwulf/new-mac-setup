# llama.cpp router-mode model presets.
#
# Used by start-llm-router.sh via `llama-server --models-preset`. Each [section]
# is a selectable model (its name is the OpenAI "model" id and what pi shows).
# This drives llama.cpp's NATIVE model management (/models, /models/load,
# /models/sse) that the pi-llama-cpp extension needs — llama-swap does not
# implement those endpoints.

# Defaults applied to every model.
[*]
jinja                = 1
flash-attn           = on
n-gpu-layers         = 999
parallel             = 1

# Qwen 3.8 (27B) Turbo

[qwen3.8-turbo]
model                = /Users/jwulf/.cache/huggingface/hub/models--DavidAU--Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP-GGUF/snapshots/c02caef111a8acf987947f35e1e288aa5450e184/Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-MTP-Q8_0.gguf
ctx-size             = 262144
cache-type-k         = q8_0
cache-type-v         = q8_0
spec-type            = draft-dflash
spec-draft-n-max     = 3
context-shift        = 1
keep                 = 4
temp                 = 0.7
top-p                = 0.80
top-k                = 20
min-p                = 0.0
presence-penalty     = 0.0
repeat-penalty       = 1.05

